<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sophia Karousos - Portfolio</title>
<meta name="description" content="Sophia Karousos, music industry portfolio.">
<link rel="icon" type="image/png" sizes="32x32" href="media/icons/icon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="media/icons/icon-64.png">
<link rel="icon" type="image/png" sizes="192x192" href="media/icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="media/icons/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Sophia Karousos - Portfolio">
<meta property="og:description" content="Sophia Karousos, music industry portfolio.">
<meta property="og:url" content="https://www.sophiakarousos.com/">
<meta property="og:image" content="https://www.sophiakarousos.com/media/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<style>
/* The scene keeps its own fixed palette in light and dark mode, by design. */
:root{
  color-scheme: light;
  --table:#26282e;
  --lcd-ink:#cfe8ff;
  --lcd-dim:#7fa6c9;
  --lcd-hi:#5ef2ff;
  --pixel:"Pixelify Sans","Courier New",monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--table);font-family:var(--pixel);overflow:hidden}
#scene{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}

/* invisible buttons over each knob */
#hits{position:fixed;inset:0;z-index:10;pointer-events:none}
.knob{position:absolute;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;pointer-events:auto}
.knob:focus{outline:none}
.knob:focus-visible{outline:3px dashed var(--lcd-hi);outline-offset:2px}
.jog{position:absolute;padding:0;border:0;background:none;border-radius:50%;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.jog:focus{outline:none}
.jog:focus-visible{outline:3px dashed var(--lcd-hi);outline-offset:2px}

/* the text on the controller's screen */
#lcd{position:fixed;z-index:5;color:var(--lcd-ink);font-size:var(--fs,14px);line-height:1.25;overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:#2d4a66 transparent;transition:opacity .08s}
#lcd.off{opacity:0}
#lcd p,#lcd h2,#lcd ol{margin:0}
#lcd .idle{height:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;color:var(--lcd-dim)}
#lcd .idle p:first-child{margin:0}
#lcd .cursor{display:inline-block;width:.55em;height:1em;background:var(--lcd-hi);vertical-align:-.12em;margin-left:.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#lcd .track{display:grid;grid-template-columns:1.25fr 1fr;gap:1.4em;height:100%}
#lcd.tall .track{grid-template-columns:1fr;gap:.9em;height:auto}
#lcd .top{display:flex;justify-content:space-between;align-items:baseline;gap:1em}
#lcd .who{color:var(--lcd-dim)}
#lcd .num{color:var(--lcd-hi);font-variant-numeric:tabular-nums}
#lcd .top.nowho{position:relative;height:0}
#lcd .top.nowho .num{position:absolute;right:0;top:0}
#lcd h2{margin-top:.15em;font-weight:700;font-size:1.65em;line-height:1.02;color:#ffffff}
#lcd .when{margin-top:.35em;color:var(--lcd-dim)}
#lcd .blurb{margin-top:.7em;max-width:38ch}
#lcd ol{list-style:none;counter-reset:t;padding:0;align-self:start}
#lcd li{counter-increment:t;display:grid;grid-template-columns:1.7em 1fr auto;gap:.4em;padding:.18em 0;border-bottom:1px dashed #22384f}
#lcd li::before{content:counter(t, decimal-leading-zero);color:var(--lcd-dim)}
#lcd .len{color:var(--lcd-dim);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){ #lcd .cursor{animation:none} }

#pop{position:fixed;inset:0;z-index:20;pointer-events:none}
#pop .win{position:absolute;pointer-events:auto;width:min(560px,calc(100vw - 24px))}
#pop .win.sizing{transition:width .3s cubic-bezier(.3,1.25,.5,1),left .3s cubic-bezier(.3,1.25,.5,1),top .3s cubic-bezier(.3,1.25,.5,1)}
#pop .win.sizing .card{transition:height .3s cubic-bezier(.3,1.25,.5,1);overflow:hidden}
@media (prefers-reduced-motion: reduce){ #pop .win.sizing,#pop .win.sizing .card{transition:none} }
#pop .win.wide{width:min(640px,calc(100vw - 24px))}
/* windows bounce in, wobble when called forward, and squash out */
#pop .win.pop-in{animation:winIn .62s cubic-bezier(.25,.9,.35,1) both}
#pop .win.nudge{animation:winNudge .42s ease-out}
#pop .win.pop-out{animation:winOut .2s ease-in both;pointer-events:none}
@keyframes winIn{0%{transform:scale(.35) translateY(18px);opacity:0}38%{transform:scale(1.09) translateY(-6px);opacity:1}56%{transform:scale(.94) translateY(2px)}72%{transform:scale(1.035) translateY(-1px)}86%{transform:scale(.99)}100%{transform:none}}
@keyframes winNudge{0%{transform:none}30%{transform:scale(1.05)}55%{transform:scale(.975)}78%{transform:scale(1.015)}100%{transform:none}}
@keyframes winOut{0%{transform:none;opacity:1}35%{transform:scale(1.05)}100%{transform:scale(.45) translateY(14px);opacity:0}}
@media (prefers-reduced-motion: reduce){ #pop .win.pop-in,#pop .win.nudge,#pop .win.pop-out{animation:none} }
#pop .card{position:relative;width:100%;max-width:560px;max-height:calc(100vh - 24px);overflow-y:auto;background:#0b1622;color:var(--lcd-ink);
  border:3px solid var(--lcd-hi);box-shadow:6px 6px 0 #0d0d10;padding:18px 20px 20px;font-size:15px;line-height:1.35}
#pop .org{margin:0;color:var(--lcd-dim)}
#pop h3{margin:.2em 2em .1em 0;font-size:1.6em;line-height:1.05;color:#fff}
#pop .when{margin:0 0 .8em;color:var(--lcd-hi)}
#pop ul{list-style:none;margin:0;padding:0}
#pop li{padding:.45em 0 .45em 1.4em;border-top:1px dashed #22384f;position:relative}
#pop li::before{content:"\25B8";position:absolute;left:0;color:var(--lcd-hi)}
#pop .nav[hidden]{display:none!important}
#pop .slide[hidden]{display:none!important}
#pop .card.has-photos{max-width:640px;display:grid}
#pop .slide{min-height:0;overflow-y:auto}
#pop .has-photos .slide{grid-area:1/1;display:block;padding:0 42px}
#pop .slide.photo{display:block;padding-top:30px;padding-bottom:4px;overflow:hidden}
#pop .slide.photo img{display:block;width:100%;height:auto;aspect-ratio:1095/715;object-fit:cover;background:#05090f;border:2px solid #22384f}
#pop .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:44px;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--lcd-hi);background:#18181d;border:2px solid var(--lcd-hi)}
#pop .nav:hover,#pop .nav:focus-visible{background:#0e2a3d;outline:none}
#pop .nav.next{right:8px}
#pop .nav.prev{left:8px}
#pop .nav i{width:0;height:0;border:8px solid transparent}
#pop .nav.next i{border-right:0;border-left:11px solid currentColor}
#pop .nav.prev i{border-left:0;border-right:11px solid currentColor}
#pop .slide.photo img.fit{width:auto;max-width:100%;max-height:68vh;aspect-ratio:auto;object-fit:contain;margin:0 auto}
#pop .slide.photo img.square{width:min(100%,62vh);aspect-ratio:1/1;margin:0 auto}
#home{position:fixed;z-index:15;top:calc(10px + env(safe-area-inset-top,0px));left:12px;font:inherit;font-size:14px;color:var(--lcd-ink);background:#18181d;border:2px solid var(--lcd-dim);padding:3px 10px;cursor:pointer}
#home:hover,#home:focus-visible{border-color:var(--lcd-hi);color:var(--lcd-hi);outline:none}
#plBtn,#atwBtn{position:fixed;z-index:15;top:calc(10px + env(safe-area-inset-top,0px));left:90px;font:inherit;font-size:14px;color:var(--lcd-ink);background:#18181d;border:2px solid var(--lcd-dim);padding:3px 10px;cursor:pointer}
#plBtn:hover,#plBtn:focus-visible,#atwBtn:hover,#atwBtn:focus-visible{border-color:var(--lcd-hi);color:var(--lcd-hi);outline:none}
.padhit{position:absolute;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;-webkit-tap-highlight-color:transparent}
.padhit:focus{outline:none}
.padhit:focus-visible{outline:3px dashed var(--lcd-hi);outline-offset:2px}
#pop .pls{position:relative;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--lcd-hi) #0e1b29}
#pop .pls::-webkit-scrollbar{width:6px}
#pop .pls::-webkit-scrollbar-track{background:#0e1b29}
#pop .pls::-webkit-scrollbar-thumb{background:var(--lcd-hi)}
#pop .pls li{padding:.7em 0;border-top:1px dashed #22384f;scroll-snap-align:start}
#pop .plnav{display:flex;align-items:center;justify-content:space-between;gap:1em;margin-top:.4em;padding-top:.6em;border-top:1px dashed #22384f;color:var(--lcd-dim);font-size:.9em;font-variant-numeric:tabular-nums}
#pop .plnav button{font:inherit;line-height:1;color:var(--lcd-hi);background:#18181d;border:2px solid var(--lcd-hi);width:36px;height:28px;padding:0;cursor:pointer}
#pop .plnav button:hover:not(:disabled),#pop .plnav button:focus-visible{background:#0e2a3d;outline:none}
#pop .plnav button:disabled{opacity:.3;cursor:default}
#pop .pls li::before{content:none}
#pop .pls li.empty{color:var(--lcd-dim);padding:1em 0}
@media (max-width:520px){ #home,#plBtn,#atwBtn{font-size:12px;padding:3px 8px} }
#pop .pls a{display:grid;grid-template-columns:76px minmax(0,1fr);grid-template-rows:auto auto 1fr;column-gap:14px;color:inherit;text-decoration:none}
#pop .pls img{grid-row:1/4;width:76px;height:76px;image-rendering:pixelated;image-rendering:crisp-edges;border:2px solid #22384f;box-shadow:2px 2px 0 #0d0d10}
#pop .pls .pln{color:#fff;font-size:1.15em;font-weight:700;line-height:1.1}
#pop .pls .plm{margin-top:.2em;color:var(--lcd-dim);font-size:.9em}
#pop .pls .plgo{align-self:end;color:var(--lcd-hi);text-decoration:underline;font-size:.9em}
#pop .pls a:hover img,#pop .pls a:focus-visible img{border-color:var(--lcd-hi)}
#pop .pls a:focus-visible{outline:2px dashed var(--lcd-hi);outline-offset:3px}
#lcd a,#pop a{color:var(--lcd-hi);text-decoration:underline}
#viewer{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(11,22,34,.7);
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#viewer.open{display:grid}
#viewer .card{position:relative;max-width:min(94vw,720px);max-height:100%;overflow:auto;background:#0b1622;border:3px solid var(--lcd-hi);box-shadow:6px 6px 0 #0d0d10;padding:46px 46px 20px}
#viewer img{display:block;max-width:100%;max-height:76vh;margin:0 auto;border:2px solid #22384f}
#viewer .nav[hidden]{display:none!important}
#viewer .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:44px;display:grid;place-items:center;padding:0;cursor:pointer;color:var(--lcd-hi);background:#18181d;border:2px solid var(--lcd-hi)}
#viewer .nav:hover,#viewer .nav:focus-visible{background:#0e2a3d;outline:none}
#viewer .nav.next{right:8px}
#viewer .nav.prev{left:8px}
#viewer .nav i{width:0;height:0;border:8px solid transparent}
#viewer .nav.next i{border-right:0;border-left:11px solid currentColor}
#viewer .nav.prev i{border-left:0;border-right:11px solid currentColor}
#viewer .x{position:absolute;top:10px;right:10px;font:inherit;font-size:14px;color:var(--lcd-ink);background:#18181d;border:2px solid var(--lcd-dim);padding:2px 8px;cursor:pointer}
#viewer .x:hover,#viewer .x:focus-visible{border-color:var(--lcd-hi);color:var(--lcd-hi);outline:none}
#pop .x{position:absolute;top:10px;right:10px;font:inherit;font-size:14px;color:var(--lcd-ink);background:#18181d;border:2px solid var(--lcd-dim);padding:2px 8px;cursor:pointer}
#pop .x:hover,#pop .x:focus-visible{border-color:var(--lcd-hi);color:var(--lcd-hi);outline:none}
#pop .x,#viewer .x{width:30px;height:30px;padding:0;display:grid;place-items:center;font-size:16px;font-weight:700;line-height:1}
#pop .links{margin-top:1em}
#pop .links .lh{margin:0 0 .3em;color:var(--lcd-dim);font-size:.85em;letter-spacing:.12em;text-transform:uppercase}
#pop .links li{padding:.35em 0 .35em 1.4em}

/* music player, top right: pixel album cover + controls */
#player{--play:#4be37a;position:fixed;z-index:15;top:calc(10px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:min(330px,calc(100vw - 104px));padding:8px 10px 6px;background:#0b1622;border:2px solid var(--lcd-dim);box-shadow:4px 4px 0 #0d0d10;color:var(--lcd-dim);font-size:12px;line-height:1.15;user-select:none;-webkit-user-select:none}
#player .top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:stretch}
#player #tCover{display:block;width:84px;height:84px;image-rendering:pixelated;image-rendering:crisp-edges;background:#05090f;border:2px solid #22384f;box-shadow:2px 2px 0 #0d0d10}
#player #tCover.flip{animation:coverIn .28s steps(4)}
@keyframes coverIn{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
#player .meta{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
#player #tTitle{display:block;color:#fff;font-size:15px;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player #tArtist{display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#player #tCount{color:var(--lcd-hi);font-size:11px;font-variant-numeric:tabular-nums}
#player input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:14px;margin:8px 0 0;background:transparent;cursor:pointer}
#player input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--lcd-ink) var(--p,0%),#2d4a66 var(--p,0%))}
#player input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#2d4a66}
#player input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--lcd-ink)}
#player input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-3px;border-radius:50%;background:#fff;border:0}
#player input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#fff;border:0}
#player input[type=range]:focus-visible{outline:2px dashed var(--lcd-hi);outline-offset:2px}
#player .times{display:flex;justify-content:space-between;margin-top:1px;font-size:11px;font-variant-numeric:tabular-nums}
#player .ctl{display:flex;align-items:center;justify-content:space-between;position:relative;top:5px}
#player .ic{flex:none;position:relative;width:22px;height:22px;padding:0;display:grid;place-items:center;background:none;border:0;color:#fff;cursor:pointer}
#player .ic svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#player .ic.solid svg{fill:currentColor;stroke:none;width:11px;height:11px}
#player .ic[aria-pressed=true]{color:var(--play)}
#player .ic[aria-pressed=true]::after{content:"";position:absolute;left:50%;bottom:0;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:currentColor}
#player .pp{flex:none;width:28px;height:28px;padding:0;display:grid;place-items:center;cursor:pointer;color:#fff;border-radius:50%;border:2px solid var(--play);box-shadow:0 0 8px rgba(75,227,122,.55),inset 0 0 0 2px #0d0d10;background:conic-gradient(#6c6c72,#2b2b30,#7c7c82,#2b2b30,#6c6c72)}
#player .pp svg{width:11px;height:11px;fill:currentColor}
#player .pp .i-pause{display:none}
#player .pp[data-playing="true"] .i-pause{display:block}
#player .pp[data-playing="true"] .i-play{display:none}
#player button:hover{filter:brightness(1.2)}
#player button:focus-visible{outline:2px dashed var(--lcd-hi);outline-offset:2px}
#player.compact #tCover{width:60px;height:60px}
#player.compact #tTitle{font-size:13px}
#player.compact #tCount{display:none}
#player.compact .ic{width:20px}
@media (max-width:520px){
  #player{padding:6px 8px 4px;font-size:11px}
  #player .top{gap:8px}
  #player #tCover{width:58px;height:58px}
  #player #tTitle{font-size:13px}
  #player #tCount{display:none}
  #player .ic{width:20px;height:20px}
  #player .pp{width:24px;height:24px}
  #player input[type=range]{margin-top:5px}
}

/* comic-burst callouts pointing at the pads */
.burst{position:fixed;z-index:12;cursor:pointer;opacity:0;transform:scale(.15) rotate(-14deg);transform-origin:var(--tx) var(--ty);transition:transform .38s cubic-bezier(.3,1.7,.5,1),opacity .18s;pointer-events:none;-webkit-tap-highlight-color:transparent}
.burst.show{opacity:1;transform:none;pointer-events:auto}
.burst .bwrap{position:absolute;inset:0;transform-origin:var(--tx) var(--ty);animation:burstBob 2.6s ease-in-out infinite}
@keyframes burstBob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2.5deg) scale(1.04)}}
.burst svg{display:block;width:100%;height:100%;overflow:visible}
.burst span{position:absolute;left:var(--cx);top:var(--cy);width:50%;transform:translate(-50%,-50%);text-align:center;font-family:var(--pixel);font-weight:700;color:#0d0d10;font-size:var(--bfs,13px);line-height:1.05}
.burst:focus{outline:none}
.burst:focus-visible .bwrap{outline:3px dashed var(--lcd-hi);outline-offset:2px}
@media (prefers-reduced-motion: reduce){ .burst{transition:opacity .18s;transform:none} .burst .bwrap{animation:none} }

/* ---------- intro: black title screen with a wandering pixel spotlight ---------- */
#intro{position:fixed;inset:0;z-index:60;background:#000;cursor:pointer;transition:opacity .55s steps(6)}
#intro.out{opacity:0;pointer-events:none}
#intro canvas{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#intro .start{position:absolute;left:50%;transform:translateX(-50%);margin:0;padding:6px 14px;font:inherit;font-size:clamp(14px,2.4vw,22px);letter-spacing:.12em;color:var(--lcd-hi);background:none;border:0;cursor:pointer;opacity:0;transition:opacity .3s}
#intro .start.on{opacity:1;animation:startBlink 1.1s steps(1) infinite}
#intro .start:focus-visible{outline:2px dashed var(--lcd-hi);outline-offset:4px}
@keyframes startBlink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){ #intro{transition:none} #intro .start.on{animation:none} }
</style>
</head>
<body>
  <div id="intro" aria-label="Sophia Karousos. Press start to enter."><canvas aria-hidden="true"></canvas><button class="start" type="button">PRESS START</button></div>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="lcd" aria-live="polite"></div>
  <div id="pop"></div>
  <div id="viewer" role="dialog" aria-modal="true" aria-label="Design work"></div>
  <button id="home" type="button">HOME</button>
  <button id="plBtn" type="button" aria-haspopup="dialog">PLAYLISTS</button>
  <button id="atwBtn" type="button" aria-haspopup="dialog">“AROUND THE WORLD”</button>
  <div id="player" role="group" aria-label="Music player">
    <div class="top">
      <img id="tCover" alt="" width="32" height="32">
      <div class="meta">
        <div><span id="tTitle"></span><span id="tArtist"></span></div>
        <span id="tCount"></span>
        <div class="ctl">
      <button id="bShuf" class="ic" type="button" aria-label="Shuffle (always on)" aria-pressed="true" title="Shuffle is always on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6h4c6 0 6 12 12 12h3M18 15l3 3-3 3M2 18h4c2 0 3.2-1 4.2-2.3M13.8 8.3C14.8 7 16 6 18 6h3M18 3l3 3-3 3"/></svg></button>
      <button id="bPrev" class="ic solid" type="button" aria-label="Previous" title="Previous"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3v16H5zM21 4v16L9 12z"/></svg></button>

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* waveform for each track */

  const r = rng(100+i), a = []; let v = .5;

  return a;
});

/* ---------- pixel helpers ---------- */
const box = (x,y,w,h,c) => { if(w<=0||h<=0) return; ctx.fillStyle = c; ctx.fillRect(O.x+x, O.y+y, w, h); };
const px = (x,y,c) => box(x,y,1,1,c);
function circle(cx,cy,r,fn){
  for(let dy=-r-1; dy<=r+1; dy++) for(let dx=-r-1; dx<=r+1; dx++){
    const d = Math.hypot(dx,dy); const c = fn(dx,dy,d); if(c) px(cx+dx, cy+dy, c);
  }
}

function drawKnob(i){
  const [cx,cy] = L.knobs[i], r = 4, a = knobAngle[i];
  const lit = selected === i, hover = hoverKnob === i && !lit;
  // LED ring, lit up to where the knob points
  circle(cx,cy,r+2,(dx,dy,d)=>{
    if(Math.abs(d-(r+2)) > .55) return null;
    const ang = Math.atan2(dx,-dy);
    if(Math.abs(ang) > SWEEP + .05) return null;
    if(lit && ang <= a + .05) return C.ledOn;
    return hover ? C.ledHover : C.ledOff;
  });
  circle(cx,cy,r,(dx,dy,d)=>{
    if(d > r + .3) return null;
    if(d > r - .9) return (dx+dy < -r*.5) ? C.knobHi : C.knobRim;
    return C.knob;
  });
  for(let t=1; t<=r-1; t++) px(Math.round(cx + Math.sin(a)*t), Math.round(cy - Math.cos(a)*t), C.pointer);
}

function drawJog(j, ang){
  const [cx,cy,r] = L.jogs[j];
  circle(cx,cy,r,(dx,dy,d)=>{
    if(d > r + .3) return null;
    if(d > r - 1) return C.outline;
    if(d > r - 4){                                   // rubber edge with grip dots that turn
      let a = Math.atan2(dy,dx) - ang; a = ((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      return (Math.floor(a/(Math.PI/18)) % 2 === 0 && Math.abs(d-(r-2.5))<.7) ? C.grip : C.rubber;
    }
    if(d > r - 6) return (dx+dy < 0) ? C.ringHi : C.ring;
    const rr = r - 6;                                 // CD-style platter top
    if(d > rr - 1) return C.discEdge;
    if(d < rr*.14) return C.outline;
    if(d < rr*.31) return C.hub;
    if(d < rr*.34) return C.hubRing;
    let a = Math.atan2(dy,dx) - ang; a = ((a%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    if(d < rr*.44) return (a % (Math.PI*2/3)) < 1.25 ? C.mark : C.disc2;
    const sa = Math.atan2(dy,dx);
    const dist = Math.min(Math.abs(Math.atan2(Math.sin(sa+.85),Math.cos(sa+.85))), Math.abs(Math.atan2(Math.sin(sa-2.29),Math.cos(sa-2.29))));
    if(a < .3 && Math.abs(d - rr*.75) < .7) return C.discEdge;
    if(dist < .2) return C.rainbow[Math.floor(d/2) % C.rainbow.length];
    return dist < .42 ? C.disc2 : C.disc;
  });
}

function drawFaderV([x,y,h], pos){
  box(x-1,y,3,h,C.track);
  for(let k=0;k<=h;k+=4){ px(x-3,y+k,C.seam); px(x+3,y+k,C.seam); }
  const cy = Math.round(y + (1-pos)*(h-3));
  box(x-3,cy,7,3,C.cap); box(x-3,cy+1,7,1,C.capLine);
}
function drawFaderH([x,y,w], pos){
  box(x,y-1,w,3,C.track);
  const cx = Math.round(x + pos*(w-3));
  box(cx,y-3,3,7,C.cap); box(cx+1,y-3,1,7,C.capLine);
}

function drawPads([x,y], lit){
  const s = L.pad, g = L.padGap;
  for(let row=0; row<2; row++) for(let col=0; col<4; col++){
    const k = row*4+col, bx = x + col*(s+g), by = y + row*(s+g);
    const on = lit === k;
    box(bx,by,s,s, on ? C.padLit[k%4] : C.padEdge);
    box(bx+1,by+1,s-2,s-2, on ? C.padLit[k%4] : C.pad);
    if(on) box(bx+1,by+1,s-2,1,"#ffffff");
    px(bx,by,C.body); px(bx+s-1,by,C.body); px(bx,by+s-1,C.body); px(bx+s-1,by+s-1,C.body);
  }
}

function drawButtons([x,y], playing){
  circle(x-5,y,3,(dx,dy,d)=> d>3.3 ? null : d>2.3 ? (playing ? C.cue : C.btnOff) : C.knob);
  circle(x+5,y,3,(dx,dy,d)=> d>3.3 ? null : d>2.3 ? (playing ? C.play : C.btnOff) : C.knob);
  if(playing){ px(x+4,y-1,C.play); px(x+4,y,C.play); px(x+4,y+1,C.play); px(x+5,y,C.play); }
}

function drawVU([x,y,h], level){
  const segs = Math.floor(h/2);
  for(let s=0; s<segs; s++){
    const sy = y + h - 2 - s*2, frac = s/segs, on = frac < level;
    const col = frac > .82 ? C.vuR : frac > .62 ? C.vuY : C.vuG;
    box(x,sy,2,1, on ? col : C.vuOff);
  }
}

function drawScreen(now){
  const s = L.screen;
  box(s.x,s.y,s.w,s.h,C.bezel);
  const ix = s.x+3, iy = s.y+3, iw = s.w-6, ih = s.h-6;
  box(ix,iy,iw,ih,C.lcd);
  for(let y=iy; y<iy+ih; y+=2) box(ix,y,iw,1,C.lcd2);   // scanlines
  // static between tracks
  if(now - switchAt < 190){
    const r = rng(Math.floor(now/40));
    for(let k=0; k<iw*ih*.35; k++) px(ix + Math.floor(r()*iw), iy + Math.floor(r()*ih), r() > .5 ? "#3d5873" : "#1d2c3c");
    return;
  }
  // waveform strip along the bottom
  const wy = iy + ih - 5, mid = Math.floor(iw/2);
  if(selected === null){ box(ix+2, wy, iw-4, 1, "#22384f"); return; }
  const w = waves[selected], off = reduce ? 0 : Math.floor((musicOn ? audio.currentTime : now/1000)*14);
  for(let k=0; k<iw-4; k++){
    const v = w[(off + k) % w.length], amp = Math.max(1, Math.round(v*3));
    box(ix+2+k, wy-amp+1, 1, amp*2-1, k < mid ? C.wavePlayed : C.wave);
  }
  box(ix+mid+2, wy-4, 1, 9, C.head);
}

/* ---------- table + controller body (static, drawn once per resize) ---------- */
function makeTable(){
  tableCanvas = document.createElement("canvas");
  tableCanvas.width = V.w; tableCanvas.height = V.h;
  const t = tableCanvas.getContext("2d");
  t.fillStyle = C.table; t.fillRect(0,0,V.w,V.h);
  const r = rng(9); t.fillStyle = C.table2;
  for(let i=0;i<V.w*V.h*.03;i++) t.fillRect(Math.floor(r()*V.w), Math.floor(r()*V.h), 1, 1);
  // checkered shadow, down and to the right
  t.fillStyle = C.shade;
  for(let y=O.y+3; y<O.y+L.H+3; y++) for(let x=O.x+3; x<O.x+L.W+3; x++){
    const inside = x < O.x+L.W && y < O.y+L.H;
    if(!inside && (x+y)%2===0) t.fillRect(x,y,1,1);
  }
}
function drawBody(){
  const {W,H} = L;
  box(1,0,W-2,H,C.outline); box(0,1,W,H-2,C.outline);
  box(1,1,W-2,H-2,C.body);
  box(2,1,W-4,1,C.bodyHi); box(1,2,1,H-4,C.bodyHi);
  box(2,H-2,W-4,1,C.bodyLo); box(W-2,2,1,H-4,C.bodyLo);
  L.seams.forEach(x=>box(x,3,1,H-6,C.seam));
  [[4,4],[W-6,4],[4,H-6],[W-6,H-6]].forEach(([x,y])=>{ box(x,y,2,2,C.screw); px(x,y,C.bodyHi); });
}

  const pl = player.getBoundingClientRect();
  const hbx = document.getElementById("home").getBoundingClientRect();
  const topGap = (L === TALL) ? Math.ceil(Math.max(pl.bottom, hbx.bottom + 2*(hbx.height + 6)) + 6) : 0;   // phones: deck sits under the player and the buttons
  P = Math.max(1, Math.min(vw*.98/L.W, (vh - topGap)*.96/L.H));
  V.w = Math.ceil(vw/P); V.h = Math.ceil(vh/P);
  canvas.width = V.w; canvas.height = V.h;
  canvas.style.width = V.w*P+"px"; canvas.style.height = V.h*P+"px";
  O.x = Math.floor((V.w - L.W)/2); O.y = Math.floor(topGap/P + (V.h - topGap/P - L.H)/2);
  if(L === WIDE){   // laptops: keep the player clear of the deck's screen
    const room = Math.floor(vw - 12 - ((O.x + L.screen.x + L.screen.w)*P + 10));
    player.style.width = Math.max(200, Math.min(330, room)) + "px";
    player.classList.toggle("compact", room < 270);
  }
  makeTable();

  const s = L.screen;
  const inner = {x:O.x+s.x+3, y:O.y+s.y+3, w:s.w-6, h:s.h-6};
  const fs = Math.max(11, Math.min(16, inner.w*P*.022));
  Object.assign(lcd.style, {left:(inner.x+2)*P+"px", top:(inner.y+1)*P+"px", width:(inner.w-4)*P+"px", height:(inner.h-8)*P+"px", padding:Math.round(fs*.5)+"px "+Math.round(fs*.7)+"px"});
  lcd.style.setProperty("--fs", fs+"px");
  lcd.classList.toggle("tall", L === TALL);

  hits.querySelectorAll(".knob").forEach((b,i)=>{
    const [kx,ky] = L.knobs[i];
    Object.assign(b.style, {left:(O.x+kx-6)*P+"px", top:(O.y+ky-6)*P+"px", width:13*P+"px", height:13*P+"px"});
  });
  hits.querySelectorAll(".jog").forEach((b,j)=>{
    const [cx,cy,r] = L.jogs[j];
    Object.assign(b.style, {left:(O.x+cx-r)*P+"px", top:(O.y+cy-r)*P+"px", width:2*r*P+"px", height:2*r*P+"px"});
  });
  const pw = 4*L.pad + 3*L.padGap, ph = 2*L.pad + L.padGap;
  hits.querySelectorAll(".padhit").forEach((b,j)=>{
    const [x,y] = L.pads[j];
    Object.assign(b.style, {left:(O.x+x)*P+"px", top:(O.y+y)*P+"px", width:pw*P+"px", height:ph*P+"px"});
  });
  // PLAYLISTS sits under HOME; on phones the player narrows to clear it
  const pb = document.getElementById("plBtn"), hb = document.getElementById("home").getBoundingClientRect();
  pb.style.left = hb.left + "px"; pb.style.top = (hb.bottom + 6) + "px";
  const ab = document.getElementById("atwBtn");
  // AROUND THE WORLD sits next to PLAYLISTS; on phones (no room beside the player) it stacks underneath
  const plr = pb.getBoundingClientRect(), plyr = document.getElementById("player");
  if(L === TALL) plyr.style.width = "";
  ab.style.left = (plr.right + 8) + "px"; ab.style.top = plr.top + "px";
  if(ab.getBoundingClientRect().right + 8 > plyr.getBoundingClientRect().left){
    ab.style.left = hb.left + "px"; ab.style.top = (plr.bottom + 6) + "px";
  }
  const colRight = Math.max(hb.right, pb.getBoundingClientRect().right, ab.getBoundingClientRect().right);
  if(colRight + 8 > document.getElementById("player").getBoundingClientRect().left){
    const pl = document.getElementById("player");   // narrow the player so it clears the stacked buttons
    pl.style.width = Math.max(180, innerWidth - 12 - (colRight + 8)) + "px";
  }
  if(typeof placeBursts === "function") placeBursts();
}

/* ---------- frame ---------- */
const fadeCur = {};
function easeTo(key, target, dt){ const c = fadeCur[key] ?? target; return fadeCur[key] = c + (target-c)*Math.min(1, dt*6); }
const targetAngle = DISCS.map(()=>0);
let jogAng = 0, last = performance.now();

/* ---------- CD scratch: click a CD to hear a record scratch and see it wobble ---------- */
const SCRATCH_URL = "media/audio/scratch.m4a", SCRATCH_LEN = 0.9;
const scratchSnd = new Audio(SCRATCH_URL); scratchSnd.preload = "auto";
const scratchAt = [-1e9, -1e9];
let duckTimer = null;
function scratchWob(j, now){
  const t = (now - scratchAt[j]) / 1000;
  if(t < 0 || t > SCRATCH_LEN || reduce) return 0;
  return Math.sin(t*Math.PI*2*4.5) * 0.9 * (1 - t/SCRATCH_LEN);   // back-and-forth, settling
}
function scratch(j){
  scratchAt[j] = performance.now();
  const s = scratchSnd.cloneNode(); s.volume = 0.9;
  const p = s.play(); if(p && p.catch) p.catch(()=>{});
  if(!audio.paused){                                // dip the song under the scratch
    audio.volume = 0.35; clearTimeout(duckTimer);
    duckTimer = setTimeout(()=>{ audio.volume = 1; }, 1100);
  }
}
["Left CD", "Right CD"].forEach((label, j)=>{
  const b = document.createElement("button");
  b.className = "jog"; b.type = "button"; b.setAttribute("aria-label", "Scratch the " + label.toLowerCase());
  b.addEventListener("click", ()=> scratch(j));
  hits.appendChild(b);
});
function frame(now){
  const dt = Math.min(.05,(now-last)/1000); last = now;
  // knobs ease toward where they were turned, in small steps
  knobAngle.forEach((a,i)=>{
    const t = targetAngle[i];
    knobAngle[i] = reduce ? t : (Math.abs(t-a) < .05 ? t : a + Math.sign(t-a)*Math.min(Math.abs(t-a), dt*9));
  });
  const playing = (selected !== null || musicOn) && now - switchAt >= 190;
  if(playing && !reduce) jogAng = Math.floor(now/1000*12)/12 * Math.PI*2*.55;

  ctx.drawImage(tableCanvas,0,0);
  drawBody();
  drawScreen(now);
  L.jogs.forEach((_,j)=>drawJog(j, (j===0 ? jogAng : -jogAng*.8 + 1) + scratchWob(j, now)));
  const beat = Math.floor(now/1000*2.2);
  const padFlash = now - padFlashAt < 700;   // pads ripple when clicked
  L.pads.forEach((p,j)=>drawPads(p, padFlash ? Math.floor(now/70 + j*4) % 8 : (playing && !reduce ? (beat + j*3) % 8 : -1)));
  const T = now/1000, mv = playing && !reduce;
  L.tempo.forEach((t,j)=>drawFaderV(t, easeTo("t"+j, mv ? .5+.3*Math.sin(T*.7+j*2.1) : .5, dt)));
  L.faders.forEach((f,j)=>drawFaderV(f, easeTo("f"+j, playing ? (reduce ? (j===0 ? .85 : .7) : .6+.3*Math.abs(Math.sin(T*(1.1+j*.6)+j))) : .15, dt)));
  drawFaderH(L.xfader, easeTo("x", mv ? .5+.4*Math.sin(T*.45) : .5, dt));
  L.buttons.forEach(b=>drawButtons(b, playing));
  L.vu.forEach((v,j)=>{
    let level = .05;
    if(playing) level = reduce ? .6 : .45 + .4*Math.abs(Math.sin(now/1000*(5.3+j*1.7))) * (.6+.4*Math.abs(Math.sin(now/1000*1.3+j)));
    drawVU(v, level);
  });
  DISCS.forEach((_,i)=>drawKnob(i));

  lcd.classList.toggle("off", now - switchAt < 190);
  requestAnimationFrame(frame);
}

/* ---------- pop-up windows ----------
   Each knob, PLAYLISTS and AROUND THE WORLD opens its own window. Windows stack and overlap instead of
   replacing each other; clicking one brings it to the front, X closes just that one, HOME closes them all. */
const pop = document.getElementById("pop");   // the layer that holds every window
const wins = new Map();                       // key -> window element
let zTop = 1, cascade = 0;
function topWin(){ let best = null; wins.forEach(w=>{ if(!best || +w.style.zIndex > +best.style.zIndex) best = w; }); return best; }
function raise(w){ if(w !== topWin() || !w.style.zIndex) w.style.zIndex = ++zTop; }
function placeWin(w, where){
  const vw = innerWidth, vh = innerHeight, W = w.offsetWidth, H = w.firstElementChild.offsetHeight, pad = 12;
  let x = (vw - W)/2, y = (vh - H)/2;
  if(vw > 640){
    if(where === "mine"){ x = Math.min(Math.max(16, vw*.07), 120); }
    else if(where === "world"){ x = Math.min(Math.max(16, vw*.24), 360); y = Math.min(Math.max(4, vh*.04), 48); }
  }
  if(where === "center"){ const k = cascade++ % 6; x += k*26 - 65; y += k*22 - 55; }   // stagger so stacked job windows show
  w.style.left = Math.max(pad, Math.min(vw - W - pad, x)) + "px";
  w.style.top  = Math.max(pad, Math.min(vh - H - pad, y)) + "px";
}
function openWin(key, label, html, wide, opener){
  const open = wins.get(key);
  if(open){ raise(open); bounce(open, "nudge"); open.querySelector(".x").focus(); return null; }   // already open: bring it forward
  const w = document.createElement("div");
  w.className = "win" + (wide ? " wide" : "");
  w.setAttribute("role", "dialog"); w.setAttribute("aria-label", label);
  w.dataset.key = key; w._opener = opener; w._slide = 0;
  w.innerHTML = html;
  pop.appendChild(w); wins.set(key, w); raise(w); bounce(w, "pop-in");
  return w;
}
function bounce(w, cls){
  w.classList.remove("pop-in", "nudge"); void w.offsetWidth; w.classList.add(cls);
  w.addEventListener("animationend", ()=> w.classList.remove(cls), {once:true});
}
function squashOut(w){
  w.classList.remove("pop-in", "nudge"); w.classList.add("pop-out");
  const gone = ()=> w.remove();
  w.addEventListener("animationend", gone, {once:true}); setTimeout(gone, 260);   // fallback if animations are off
}
function closeWin(w){
  if(!w) return;
  wins.delete(w.dataset.key); squashOut(w);
  const next = topWin();
  if(next) next.querySelector(".x").focus();
  else if(w._opener && document.contains(w._opener)) w._opener.focus();
}
function closePop(){ wins.forEach(w=> squashOut(w)); wins.clear(); }
function goSlide(w, n){
  const slides = w.querySelectorAll(".slide"); if(!slides.length) return;
  const card = w.querySelector(".card");
  const r0 = w.getBoundingClientRect(), h0 = card.offsetHeight;
  w._slide = Math.max(0, Math.min(slides.length-1, n));
  slides.forEach((el,k)=>{ el.hidden = k !== w._slide; });
  const prev = w.querySelector(".prev"), next = w.querySelector(".next");
  if(prev) prev.hidden = w._slide === 0;
  if(next) next.hidden = w._slide === slides.length-1;
  if(document.activeElement && document.activeElement.hidden) w.querySelector(".x").focus();
  fitWin(w, r0, h0);
  const img = slides[w._slide].querySelector("img");   // a photo that hasn't loaded yet: re-fit once it has
  if(img && !img.complete) img.addEventListener("load", ()=> fitWin(w, w.getBoundingClientRect(), card.offsetHeight), {once:true});
}
/* resize a window to fit its current slide: text slides stay compact, photo slides grow; it grows from its center */
function fitWin(w, r0, h0){
  const card = w.querySelector(".card"), slide = w.querySelectorAll(".slide")[w._slide];
  const photo = !!(slide && slide.classList.contains("photo"));
  w.classList.remove("sizing"); card.style.height = "";
  w.classList.toggle("wide", photo); w.style.width = "";
  const w1 = w.offsetWidth, h1 = card.offsetHeight;          // natural size for this slide
  if(Math.abs(w1 - r0.width) < 1 && Math.abs(h1 - h0) < 1) return;
  const pad = 12, cx = r0.left + r0.width/2, cy = r0.top + h0/2;
  const x1 = Math.max(pad, Math.min(innerWidth - w1 - pad, cx - w1/2)), y1 = Math.max(pad, Math.min(innerHeight - h1 - pad, cy - h1/2));
  // start from the old size, then animate to the new one
  w.style.width = r0.width + "px"; card.style.height = h0 + "px";
  void w.offsetWidth;
  w.classList.add("sizing");
  w.style.width = w1 + "px"; card.style.height = h1 + "px"; w.style.left = x1 + "px"; w.style.top = y1 + "px";
  clearTimeout(w._fitT);
  w._fitT = setTimeout(()=>{ w.classList.remove("sizing"); w.style.width = ""; card.style.height = ""; }, 340);
}
function openPop(i){
  const d = DISCS[i], ph = d.photos || [];
  const text = `<div class="slide">
      <p class="org">${esc(d.who)}</p>
      <h3>${esc(d.full||d.role)}</h3>
      <p class="when">${esc(d.when)}</p>
      <ul>${(d.details||[]).map(t=>`<li>${linkify(t)}</li>`).join("")}</ul>
      ${d.links && d.links.length ? `<div class="links"><p class="lh">Links</p><ul>${d.links.map(([label, url])=>`<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} \u2197</a></li>`).join("")}</ul></div>` : ""}
    </div>`;
  const pics = ph.map((u,k)=>`<div class="slide photo" hidden><img class="${d.photoFit==="contain" ? "fit" : d.photoFit==="square" ? "square" : ""}" src="${esc(u)}" alt="${esc(d.who||d.role)}" style="object-position:${esc((d.photoPos&&d.photoPos[k])||"50% 50%")}"></div>`).join("");
  const nav = ph.length ? `<button class="nav prev" type="button" aria-label="Previous slide" hidden><i></i></button><button class="nav next" type="button" aria-label="Next slide"><i></i></button>` : "";
  const w = openWin("job" + i, d.full || d.role, `<div class="card${ph.length ? " has-photos" : ""}">
    <button class="x" type="button" aria-label="Close">X</button>
    ${text}${pics}${nav}
  </div>`, false, hits.querySelectorAll(".knob")[i]);
  if(!w) return;
  w._disc = i;
  placeWin(w, "center");
  w.querySelector(".x").focus();
}
pop.addEventListener("pointerdown", e=>{ const w = e.target.closest(".win"); if(w) raise(w); });
pop.addEventListener("focusin", e=>{ const w = e.target.closest(".win"); if(w) raise(w); });
pop.addEventListener("click", e=>{
  const w = e.target.closest(".win"); if(!w) return;
  if(e.target.closest(".slide-link")){ e.preventDefault(); openViewer(w._disc); return; }
  const nb = e.target.closest(".nav");
  if(nb){ goSlide(w, w._slide + (nb.classList.contains("next") ? 1 : -1)); return; }
  if(e.target.closest(".x")) closeWin(w);
});
addEventListener("keydown", e=>{
  if(viewer.classList.contains("open")){
    if(e.key==="Escape") closeViewer();
    else if(e.key==="ArrowRight") stepViewer(1);
    else if(e.key==="ArrowLeft") stepViewer(-1);
    return;
  }
  const w = topWin(); if(!w) return;
  if(e.key==="Escape") closeWin(w);
  else if(w._disc === undefined) return;
  else if(e.key==="ArrowRight") goSlide(w, w._slide+1);
  else if(e.key==="ArrowLeft") goSlide(w, w._slide-1);
});

  vIdx = 0; viewer.classList.add("open"); drawViewer();

function stepViewer(d){ const n = vIdx + d; if(n < 0 || n >= vList.length) return; vIdx = n; drawViewer(); }

}

  const w = openWin(key, title, `<div class="card"><button class="x" type="button" aria-label="Close">X</button>
    <p class="org">${esc(org)}</p><h3>${esc(title)}</h3><ul class="pls">${items}</ul></div>`, false, opener);
  if(!w) return;
  // show 3 playlists at a time; scroll (or use the arrows) for the rest
  const list = w.querySelector(".pls"), lis = list.children, SHOW = 3;
  if(lis.length > SHOW){
    list.style.maxHeight = (lis[SHOW-1].offsetTop + lis[SHOW-1].offsetHeight) + "px";
    const nav = document.createElement("div"); nav.className = "plnav";
    nav.innerHTML = `<button type="button" class="up" aria-label="Previous playlists">\u25b2</button><span aria-live="polite"></span><button type="button" class="down" aria-label="More playlists">\u25bc</button>`;
    list.after(nav);
    const step = ()=> lis[1].offsetTop - lis[0].offsetTop;
    const sync = ()=>{
      const first = Math.round(list.scrollTop / step());
      nav.querySelector("span").textContent = `${first+1}\u2013${Math.min(first+SHOW, lis.length)} of ${lis.length}`;
      nav.querySelector(".up").disabled = first <= 0;
      nav.querySelector(".down").disabled = first + SHOW >= lis.length;
    };
    nav.querySelector(".up").addEventListener("click", ()=> list.scrollBy({top:-step(), behavior:"smooth"}));
    nav.querySelector(".down").addEventListener("click", ()=> list.scrollBy({top:step(), behavior:"smooth"}));
    list.addEventListener("scroll", sync, {passive:true});
    sync();
  }
  placeWin(w, key);
  w.querySelector(".x").focus();
}

function hideBursts(){ bursts.forEach(b=>b.classList.remove("show")); }
function placeBursts(){
  // bursts sit in the space ABOVE the pads, tail pointing down at them
  const pw = 4*L.pad + 3*L.padGap, wide = (L === WIDE);
  const RATIO = 164/214, MIN_W = 112;
  const home = document.getElementById("home").getBoundingClientRect(), plb = document.getElementById("plBtn").getBoundingClientRect(), atw = document.getElementById("atwBtn").getBoundingClientRect();
  const player = document.getElementById("player").getBoundingClientRect();
  const deckTop = O.y*P + 4;
  bursts.forEach((b,j)=>{
    const [x,y] = L.pads[j], mirror = j === 1;
    const tipX = mirror ? 1 - BURST_TIP.x : BURST_TIP.x, tipY = BURST_TIP.y;
    const padCx = (O.x + x + pw/2)*P, padTop = (O.y + y)*P;
    let w = wide ? Math.round(Math.min(160, Math.max(124, 24*P))) : Math.round(Math.min(150, innerWidth*0.4));
    const place = ()=>{ const l = Math.max(4, Math.min(innerWidth - w - 4, padCx - tipX*w)); return {l, t:padTop - 2 - tipY*w*RATIO}; };
    let {l, t} = place();
    // keep clear of the buttons and the music player: slide along the pads first, then shrink to fit, or hide
    const padR = (O.x + x + pw)*P;
    [home, plb, atw].forEach(r=>{
      if(r.left < l + w && r.right > l && r.bottom > t && r.right + 8 + tipX*w <= padR - 6) l = Math.max(l, r.right + 8);
    });
    const blockers = [home, plb, atw, player].filter(r => r.left < l + w && r.right > l && r.top < padTop);
    const limit = Math.max(deckTop, ...blockers.map(r => r.bottom + 6));
    if(t < limit){ const tip = l + tipX*w; w = Math.floor((padTop - 2 - limit) / (tipY*RATIO)); l = tip - tipX*w; t = padTop - 2 - tipY*w*RATIO; }
    b.hidden = j === 1 || w < MIN_W;   // only the left burst is used
    const h = Math.round(w*RATIO);
    Object.assign(b.style, {left:l+"px", top:t+"px", width:w+"px", height:h+"px"});
    b.style.setProperty("--tx", (tipX*w) + "px"); b.style.setProperty("--ty", (tipY*h) + "px");
    b.style.setProperty("--cx", ((mirror ? 1 - BURST_MID.x : BURST_MID.x)*100) + "%");
    b.style.setProperty("--cy", (BURST_MID.y*100) + "%");
    b.style.setProperty("--bfs", Math.max(10, Math.round(w*0.09)) + "px");
    b.querySelector(".bshape").setAttribute("transform", `translate(${mirror ? 190 : 0} 0) scale(${mirror ? -1 : 1} 1)`);
  });
}

  tArtist.textContent = t.artist;
  tCount.textContent = String(i+1).padStart(2,"0") + " / " + String(TRACKS.length).padStart(2,"0");
  tCover.alt = t.title + " cover";
  if(tCover.getAttribute("src") !== t.cover){
    tCover.src = t.cover;
    tCover.classList.remove("flip"); void tCover.offsetWidth; tCover.classList.add("flip");
  }
  if("mediaSession" in navigator){ try{ navigator.mediaSession.metadata = new MediaMetadata({title:t.title, artist:t.artist}); }catch(e){} }
  paintPlayer();
  if(play) startPlay();
}
function nextIndex(){
  const n = TRACKS.length;
  if(shuffleOn && n > 1){ let k; do{ k = Math.floor(Math.random()*n); }while(k === tIdx); return k; }
  return (tIdx + 1) % n;
}
audio.addEventListener("play", ()=>{ musicOn = true; syncPlayBtn(); });
audio.addEventListener("pause", ()=>{ musicOn = false; syncPlayBtn(); });
audio.addEventListener("timeupdate", paintPlayer);
audio.addEventListener("loadedmetadata", ()=>{
  if(pendingSeek !== null){ audio.currentTime = pendingSeek*dur(); pendingSeek = null; }
  paintPlayer();
});
audio.addEventListener("ended", ()=> loadTrack(nextIndex(), true));
bPlay.addEventListener("click", ()=>{ if(audio.paused) startPlay(); else audio.pause(); });
bNext.addEventListener("click", ()=> loadTrack(nextIndex(), true));
bPrev.addEventListener("click", ()=>{
  if((audio.currentTime || 0) > 3){ audio.currentTime = 0; paintPlayer(); }
  else loadTrack((tIdx - 1 + TRACKS.length) % TRACKS.length, true);
});
bShuf.addEventListener("click", ()=>{ shuffleOn = true; bShuf.setAttribute("aria-pressed", "true"); });   // shuffle stays on at all times
bRep.addEventListener("click", ()=>{ repeatOn = !repeatOn; audio.loop = repeatOn; bRep.setAttribute("aria-pressed", repeatOn); });
seek.addEventListener("pointerdown", ()=>{ dragging = true; });
["pointerup","pointercancel","change","blur"].forEach(ev => seek.addEventListener(ev, ()=>{ dragging = false; }));
seek.addEventListener("input", ()=>{
  const f = seek.value/1000;
  if(audio.readyState >= 1) audio.currentTime = f*dur(); else pendingSeek = f;
  paintPlayer();
});
if("mediaSession" in navigator){
  try{
    navigator.mediaSession.setActionHandler("play", ()=> startPlay());
    navigator.mediaSession.setActionHandler("pause", ()=> audio.pause());
    navigator.mediaSession.setActionHandler("nexttrack", ()=> bNext.click());
    navigator.mediaSession.setActionHandler("previoustrack", ()=> bPrev.click());
  }catch(e){}
}
loadTrack(0, false);
syncPlayBtn();

addEventListener("resize", layout);
showIdle();
layout();
requestAnimationFrame(frame);

/* ---------- intro: black screen, a pixel spotlight wanders, then lands on the name ---------- */
(function(){
  const intro = document.getElementById("intro"); if(!intro) return;
  const cv = intro.querySelector("canvas"), g = cv.getContext("2d"), btn = intro.querySelector(".start");
  const NAME = "SOPHIA KAROUSOS", SUB = "RANDOM ACCESS MEMORIES";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const WANDER = reduce ? 0 : 3.6, SETTLE = 0.7;          // seconds
  let W, H, PIX, fontPx, t0 = null, done = false, prompted = false;
  const tx = document.createElement("canvas"), tg = tx.getContext("2d");   // low-res mask: where the light falls
  // the name is drawn at full screen resolution so it stays sharp; only the light is pixelated
  const hi = document.createElement("canvas"), hg = hi.getContext("2d"); hi.setAttribute("aria-hidden", "true");
  intro.insertBefore(hi, btn);
  let DPR = 1;
  function size(){
    PIX = Math.max(3, Math.round(Math.min(innerWidth, innerHeight)/170));
    W = Math.ceil(innerWidth/PIX); H = Math.ceil(innerHeight/PIX);
    cv.width = tx.width = W; cv.height = tx.height = H;
    DPR = Math.min(3, window.devicePixelRatio || 1);
    hi.width = Math.round(innerWidth*DPR); hi.height = Math.round(innerHeight*DPR);
    fontPx = Math.max(9, Math.min(Math.round(H*0.11), Math.floor(W*0.9/(NAME.length*0.66))));
    btn.style.top = ((H/2 + fontPx*1.55) * PIX) + "px";
  }
  // where the light goes: a few stops around the dark stage, then the name
  const STOPS = [[-.15,.15],[.2,.3],[.78,.22],[.86,.62],[.28,.72],[.62,.42],[.5,.5]];
  function cr(p0,p1,p2,p3,t){ const t2=t*t, t3=t2*t; return .5*((2*p1)+(-p0+p2)*t+(2*p0-5*p1+4*p2-p3)*t2+(-p0+3*p1-3*p2+p3)*t3); }
  function lightAt(sec){
    if(sec >= WANDER) return [.5,.5];
    let u = sec/WANDER; u = 1 - Math.pow(1-u, 2.2);       // slows down as it finds the name
    const n = STOPS.length-1, f = u*n, i = Math.min(n-1, Math.floor(f)), t = f - i;
    const P = k => STOPS[Math.max(0, Math.min(n, k))];
    return [cr(P(i-1)[0],P(i)[0],P(i+1)[0],P(i+2)[0],t), cr(P(i-1)[1],P(i)[1],P(i+1)[1],P(i+2)[1],t)];
  }
  const SQ = .56;   // a spotlight pool on a stage floor is an ellipse
  function disc(c, x, y, r){ c.beginPath(); c.ellipse(x, y, r, r*SQ, 0, 0, Math.PI*2); c.fill(); }
  function draw(now){
    if(done) return;
    if(t0 === null) t0 = now;
    const sec = (now - t0)/1000;
    const [fx, fy] = lightAt(sec);
    const x = Math.round(fx*W), y = Math.round(fy*H);
    const textW = NAME.length*fontPx*0.66;
    const rWander = Math.min(W, H)*0.2, rFinal = Math.max(rWander, textW*0.62);
    const k = Math.min(1, Math.max(0, (sec - WANDER)/SETTLE)), ease = 1 - Math.pow(1-k, 3);
    let r = rWander + (rFinal - rWander)*ease;
    if(sec > WANDER && sec < WANDER + .45 && !reduce) r *= (Math.floor(sec*18) % 2 ? 1 : .93);   // a little flicker as it lands
    g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
    // beam from above, then the pool of light in stepped bands (pixel look)
    g.fillStyle = "rgba(255,240,205,.045)";
    g.beginPath(); g.moveTo(x - r*.12, 0); g.lineTo(x + r*.12, 0); g.lineTo(x + r*.96, y); g.lineTo(x - r*.96, y); g.closePath(); g.fill();
    [[1, .07],[.84, .1],[.66, .13],[.46, .16]].forEach(([m, a])=>{ g.fillStyle = `rgba(255,240,205,${a})`; disc(g, x, y, r*m); });
    // the name only shows where the light falls: crisp text, cut out by the blocky pool of light
    tg.clearRect(0, 0, W, H); tg.fillStyle = "#000"; disc(tg, x, y, r*.97);
    const sx = hi.width / W, sy = hi.height / H;
    hg.globalCompositeOperation = "source-over"; hg.clearRect(0, 0, hi.width, hi.height);
    hg.fillStyle = "#fff"; hg.textAlign = "center"; hg.textBaseline = "middle";
    hg.font = `700 ${Math.round(fontPx*sy)}px "Pixelify Sans", "Courier New", monospace`;
    hg.fillText(NAME, hi.width/2, hi.height/2);
    hg.fillStyle = "#9cc3e6"; hg.font = `500 ${Math.round(Math.max(6, fontPx*.36)*sy)}px "Pixelify Sans", "Courier New", monospace`;
    hg.fillText(SUB, hi.width/2, hi.height/2 + fontPx*.85*sy);
    hg.globalCompositeOperation = "destination-in"; hg.imageSmoothingEnabled = false;
    hg.drawImage(tx, 0, 0, hi.width, hi.height);
    if(!prompted && sec >= WANDER + SETTLE){ prompted = true; btn.classList.add("on"); }
    requestAnimationFrame(draw);
  }
  function enter(){
    if(done) return; done = true;
    // the deck opens with “Lose Yourself to Dance” (pressing start counts as the click browsers need before playing sound)
    const k = TRACKS.findIndex(t => t.title === "Lose Yourself to Dance");
    if(k >= 0) loadTrack(k, true);
    intro.classList.add("out");
    setTimeout(()=>{ intro.remove(); showBursts(); document.getElementById("home").focus(); }, reduce ? 0 : 560);
  }
  intro.addEventListener("click", enter);
  addEventListener("keydown", function k(e){ if(!document.contains(intro)){ removeEventListener("keydown", k); return; } e.preventDefault(); e.stopImmediatePropagation(); enter(); }, true);
  addEventListener("resize", size);
  size();
  const ready = document.fonts && document.fonts.load ? document.fonts.load('700 20px "Pixelify Sans"') : Promise.resolve();
  Promise.race([ready, new Promise(r => setTimeout(r, 1200))]).then(()=>{ size(); requestAnimationFrame(draw); });
})();
</script>
</body>
